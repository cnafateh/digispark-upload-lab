services:
  digispark-upload-lab:
    image: ghcr.io/cnafateh/digispark-upload-lab:${IMAGE_TAG:-latest}

    container_name: digisparkUploadLab
    restart: unless-stopped
    pull_policy: always

    environment:
      APP_TITLE: "${APP_TITLE:-Digispark Upload Lab}"
      UPLOAD_API_KEY: "${UPLOAD_API_KEY}"
      ADMIN_KEY: "${ADMIN_KEY}"
      UPLOAD_DIR: "/data/uploads"
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-5}"
      ALLOWED_EXTENSIONS: "${ALLOWED_EXTENSIONS:-.txt}"

    volumes:
      - digispark_uploads:/data/uploads

    networks:
      - proxy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  digispark_uploads:
    name: digispark_uploads

networks:
  proxy:
    external: true